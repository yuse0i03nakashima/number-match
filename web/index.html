<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0c0d11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TEN — Number Match</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main id="app" class="app">
    <header class="hud">
      <div class="hud-left">
        <div class="label" id="hud-stage-label">STAGE 01</div>
        <div class="sub" id="hud-world-label">world 1</div>
      </div>
      <div class="hud-center">
        <div class="label">SCORE</div>
        <div class="score" id="hud-score">0</div>
      </div>
      <div class="hud-right">
        <div class="lives" id="hud-lives" aria-label="ライフ"></div>
        <div class="chain" id="hud-chain">
          <span class="chain-mult" id="hud-mult">×1.0</span>
          <span class="chain-bar"><span class="chain-fill" id="hud-chain-fill"></span></span>
        </div>
      </div>
    </header>

    <section class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="grid" aria-label="盤面"></div>
    </section>

    <footer class="controls">
      <button class="ctl" id="btn-hint" type="button">
        <span class="ctl-label">HINT</span>
        <span class="ctl-sub">チェーン切れ</span>
      </button>
      <button class="ctl ctl-primary" id="btn-add" type="button">
        <span class="ctl-label">＋ ADD</span>
        <span class="ctl-sub" id="add-stock" aria-label="追加の残り"></span>
      </button>
      <button class="ctl" id="btn-menu" type="button">
        <span class="ctl-label">MENU</span>
        <span class="ctl-sub" id="btn-sound-state">sound on</span>
      </button>
    </footer>
  </main>

  <div class="toast" id="toast" hidden></div>

  <div class="overlay" id="overlay" hidden>
    <div class="card" id="overlay-card"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
