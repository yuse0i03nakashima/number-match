<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0c0d11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>THE TEN — Number Match</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main id="app" class="app">
    <header class="hud">
      <div class="hud-left">
        <div class="label" id="hud-stage-label">STAGE 01</div>
        <div class="sub" id="hud-world-label">world 1</div>
      </div>
      <div class="hud-center">
        <div class="label">SCORE</div>
        <div class="score" id="hud-score">0</div>
      </div>
      <div class="hud-right">
        <div class="lives" id="hud-lives" aria-label="Heart"></div>
        <div class="chain" id="hud-chain" aria-label="Chain">
          <span class="chain-mult" id="hud-mult">×1.0</span>
          <span class="chain-bars">
            <span class="chain-bar"><span class="chain-fill" id="hud-chain-fill"></span></span>
            <span class="gauge-bar" title="Chain gauge"><span class="gauge-fill" id="hud-gauge-fill"></span></span>
          </span>
        </div>
      </div>
    </header>

    <div class="fever" id="hud-fever" hidden>
      <span class="fever-label">FEVER ×2</span>
      <span class="fever-bar"><span class="fever-fill" id="hud-fever-fill"></span></span>
    </div>

    <div class="vsbar" id="vs-bar" hidden>
      <span class="vs-time" id="vs-time">3:00</span>
      <span class="vs-rival"><span class="vs-name">RIVAL</span><span class="vs-rscore" id="vs-rscore">0</span><span class="vs-rmult" id="vs-rmult">×1.0</span></span>
      <span class="vs-prog"><span class="vs-prog-fill" id="vs-rprog"></span></span>
      <span class="vs-rstate" id="vs-rstate"></span>
    </div>

    <div class="quest" id="hud-quest" hidden>
      <span class="quest-label">QUEST</span>
      <span class="quest-text" id="hud-quest-text"></span>
      <span class="quest-mark" id="hud-quest-mark"></span>
    </div>

    <section class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Board"></div>
    </section>

    <footer class="controls">
      <button class="ctl tier-hint" id="btn-hint" type="button">
        <span class="ctl-label" id="btn-hint-label">HINT</span>
        <span class="ctl-sub" id="btn-hint-sub"></span>
      </button>
      <button class="ctl ctl-primary" id="btn-add" type="button">
        <span class="ctl-label" id="btn-add-label">＋ ADD</span>
        <span class="ctl-sub" id="add-stock" aria-label="Add の残り"></span>
      </button>
      <button class="ctl" id="btn-menu" type="button">
        <span class="ctl-label">MENU</span>
        <span class="ctl-sub" id="btn-sound-state">sound on</span>
      </button>
    </footer>
  </main>

  <!-- スロット(SLOT タブ。THE TEN とは別の画面) -->
  <section id="slot" class="slot" hidden>
    <div class="slot-logo"><span class="logo-main">THE TEN</span><span class="logo-sub">SLOT</span></div>
    <header class="slot-top">
      <div class="slot-top-l"><div class="label">COIN</div><div class="slot-coins" id="slot-coins">0</div></div>
      <div class="slot-lamp" id="slot-lamp">予告</div>
      <div class="slot-top-r"><div class="label">WIN</div><div class="slot-win" id="slot-win">0</div></div>
    </header>
    <div class="slot-bonus" id="slot-bonus" hidden><span id="slot-bonus-label">BIG BONUS</span><span id="slot-bonus-left"></span></div>
    <div class="cabinet" id="cabinet">
    <div class="marquee top"></div><div class="marquee l"></div><div class="marquee r"></div>
    <div class="reels" id="reels">
      <div class="reel" data-reel="0"><div class="strip" id="strip-0"></div><div class="reel-mid"></div></div>
      <div class="reel" data-reel="1"><div class="strip" id="strip-1"></div><div class="reel-mid"></div></div>
      <div class="reel" data-reel="2"><div class="strip" id="strip-2"></div><div class="reel-mid"></div></div>
    </div>
    <div class="marquee bottom"></div>
    </div>
    <div class="slot-stops">
      <button class="ctl stop" type="button" data-stop="0"><span class="ctl-label">STOP</span></button>
      <button class="ctl stop" type="button" data-stop="1"><span class="ctl-label">STOP</span></button>
      <button class="ctl stop" type="button" data-stop="2"><span class="ctl-label">STOP</span></button>
    </div>
    <div class="slot-pay">
      <span><b>TEN TEN TEN</b> BIG</span><span><b>★★★</b> REG</span><span><b>同じ数字×3</b> 数字×2</span><span><b>合計 10</b> 6</span><span><b>足して 10 + ★</b> 2</span>
    </div>
    <div class="slot-stats" id="slot-stats"></div>
    <footer class="controls slot-controls">
      <button class="ctl" id="slot-bet" type="button"><span class="ctl-label">BET 5</span><span class="ctl-sub">5 lines</span></button>
      <button class="ctl ctl-primary" id="slot-start" type="button"><span class="ctl-label">START</span><span class="ctl-sub"></span></button>
      <button class="ctl" id="slot-menu" type="button"><span class="ctl-label">MENU</span><span class="ctl-sub">title · sound</span></button>
    </footer>
  </section>

  <div class="toast" id="toast" hidden></div>

  <div class="overlay" id="overlay" hidden>
    <div class="card" id="overlay-card"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
